name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A branch push and its pull request both trigger this workflow, and a new push
# supersedes the previous one. Without this, six matrix jobs per run pile up on
# the shared runners and later runs wait on work nobody is going to read.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 22.16 is the supported floor in package.json engines; 24 is the current line.
        node-version: ['22.16', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install optional mail SDK for offline compatibility checks
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/install-mail.ps1
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke-install.mjs
